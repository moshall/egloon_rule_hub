name: sync-loon-online-compat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/sync_loon_online_compat.py
      - .github/workflows/sync-loon-online-compat.yml
  schedule:
    - cron: '15 20 * * *'
permissions:
  contents: write
concurrency:
  group: loon-online-compat-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Convert public feeds for Loon
        run: python tools/sync_loon_online_compat.py
      - name: Commit converted public resources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Rule/Loon/OnlineCompat
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh Loon online compatibility resources'
          git pull --rebase origin main
          git push origin HEAD:main
