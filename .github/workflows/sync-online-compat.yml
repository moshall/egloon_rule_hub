name: sync-online-compat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/sync_mihomo_online_compat.py
      - .github/workflows/sync-online-compat.yml
  schedule:
    # UTC 20:00 = Asia/Shanghai 04:00 the following day.
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: online-compat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Convert public feeds
        run: python tools/sync_mihomo_online_compat.py
      - name: Commit updated providers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Rule/Clash/OnlineCompat
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh Mihomo online compatibility providers'
          git pull --rebase origin main
          git push origin HEAD:main
